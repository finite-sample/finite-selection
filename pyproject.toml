[project]
name = "finite-selection"
description = "Finite Selection Model for randomized, balanced allocation of units to treatment groups"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
requires-python = ">=3.12"
version = "0.1.0"
keywords = [
    "experimental design",
    "randomization",
    "covariate balance",
    "finite selection model",
    "causal inference",
    "randomized controlled trials",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/finite-sample/finite-selection"
Documentation = "https://finite-sample.github.io/finite-selection/"
Repository = "https://github.com/finite-sample/finite-selection"
Issues = "https://github.com/finite-sample/finite-selection/issues"
Changelog = "https://github.com/finite-sample/finite-selection/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
data = [
    "pyarrow>=15",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "finite_selection"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pre-commit>=4",
    { include-group = "test" },
]
test = [
    "matplotlib>=3.8",
    "pyarrow>=15",
    "pytest>=8",
    "pytest-cov>=6",
]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention this standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`,
# which the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments and private-member access are how tests are written.
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["src"]

[tool.preen]

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
# som is the selection order matrix function, named as in the R package.
ignore-words-list = "som"
